name: S6 Follow Me Characterization

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  followme-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check syntax
        run: |
          node --check src/core/followme.engine.js
          node --check src/tests/s6-followme-characterization.test.js
      - name: Run Follow Me characterization tests
        run: node --test src/tests/s6-followme-characterization.test.js
