name: S5 FIFO 1 PostgreSQL Tests

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - test/s5-fifo1-registration

permissions:
  contents: read

jobs:
  fifo1-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TEST_DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Require isolated PostgreSQL test database
        run: test -n "$TEST_DATABASE_URL"
      - name: Run FIFO 1 PostgreSQL tests
        run: node --test src/tests/s5-fifo1.test.js
