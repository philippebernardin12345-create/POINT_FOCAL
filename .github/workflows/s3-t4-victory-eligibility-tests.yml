name: S3-T4 Victory eligibility tests

on:
  pull_request:
    paths:
      - "src/modules/victory-world/**"
      - "src/tests/victory-world-eligibility.test.js"
      - ".github/workflows/s3-t4-victory-eligibility-tests.yml"
  push:
    paths:
      - "src/modules/victory-world/**"
      - "src/tests/victory-world-eligibility.test.js"
      - ".github/workflows/s3-t4-victory-eligibility-tests.yml"

jobs:
  victory-world-eligibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node --test src/tests/victory-world-eligibility.test.js
