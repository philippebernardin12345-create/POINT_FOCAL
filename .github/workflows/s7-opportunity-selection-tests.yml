name: S7 Opportunity Selection Characterization

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  opportunity-selection-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check syntax
        run: |
          node --check src/core/opportunity.engine.js
          node --check src/modules/opportunities/opportunities.service.js
          node --check src/modules/opportunities/opportunities.controller.js
          node --check src/modules/opportunities/opportunities.routes.js
          node --check src/modules/opportunities/opportunities.repository.js
          node --check src/modules/opportunities/opportunities.registry.js
          node --check src/modules/payments/payments.service.js
          node --check src/modules/victory-world/victory-world.repository.js
          node --check src/modules/victory-world/victory-world.service.js
          node --check src/tests/s7-opportunity-selection.test.js
          node --check src/tests/s7-opportunity-user-progress.test.js
          node --check src/tests/s7-payment-opportunity-membership.test.js
      - name: Run opportunity selection characterization tests
        run: node --test src/tests/s7-opportunity-selection.test.js src/tests/s7-opportunity-user-progress.test.js src/tests/s7-payment-opportunity-membership.test.js
