name: S1 Roll-Up FIFO2 Tests

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - fix/s1-rollup-fifo2-consolidated
      - feat/s1-inactivity-report-verification

permissions:
  contents: read

jobs:
  s1-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TEST_DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
      PRODUCTION_SUPABASE_PROJECT_REF: ${{ vars.PRODUCTION_SUPABASE_PROJECT_REF }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Syntax check S1 services and tests
        run: |
          node --check src/core/rollup.service.js
          node --check src/core/v2-rotation.service.js
          node --check src/core/opportunity-inactivity.service.js
          node --check src/modules/opportunities/opportunity-inactivity.controller.js
          node --check src/tests/s3-rollup-fifo2.test.js
          node --check src/tests/s3-inactivity-report-verification.test.js
          node --check src/tests/v106-step1.test.js
      - name: Run S3 Roll-Up FIFO2 invariants
        run: node --test src/tests/s3-rollup-fifo2.test.js
      - name: Run inactivity report verification invariants
        run: node --test src/tests/s3-inactivity-report-verification.test.js
      - name: Run V10.6/S1 PostgreSQL integration tests
        if: ${{ env.TEST_DATABASE_URL != '' }}
        run: node --test src/tests/v106-step1.test.js
      - name: Report missing integration database
        if: ${{ env.TEST_DATABASE_URL == '' }}
        run: echo "TEST_DATABASE_URL is not configured; PostgreSQL integration tests were not executed."
